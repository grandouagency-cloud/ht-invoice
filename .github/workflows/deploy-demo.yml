name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ht-invoice-demo/**'

# Seule permission globale nécessaire : lire le code source (checkout)
permissions:
  contents: read

# Force Node.js 24 sur tous les jobs du workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ht-invoice-demo/package-lock.json

      - name: Install dependencies
        working-directory: ht-invoice-demo
        run: npm ci

      - name: Build
        working-directory: ht-invoice-demo
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ht-invoice-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # ✅ pages: write et id-token: write DOIVENT être ici,
    #    sur le job deploy, pas au niveau du workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
